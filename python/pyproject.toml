[build-system]
requires = ["oryn~=1.3"]
build-backend = "oryn"

[project]
name = "umac"
version = "0.0"
description = "Implementation of UMAC defined by RFC 4418"
license = "EUPL-1.2"
readme = "readme.md"
requires-python = "~=3.11"

[project.urls]
Repository = "https://github.com/slietar/umac"

[tool.oryn]
include = ["umac.*"]
